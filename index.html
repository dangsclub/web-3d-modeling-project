<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>와콤 펜으로 배우는 웹 3D 모델링 따라하기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>✏️ 와콤 펜과 함께하는 3D 모델링 튜토리얼</h1>
    <p>패드와 펜을 쥐고 화면의 가이드를 따라 3D 형태를 완성해 보세요!</p>
  </header>

  <main class="container">
    <!-- 3D 캔버스 영역 -->
    <section class="canvas-section">
      <div id="canvas-container"></div>
      <p class="instruction">💡 와콤 펜으로 캔버스를 드래그하여 각도를 돌려보세요.</p>
    </section>

    <!-- 따라하기 단계 제어 튜토리얼 영역 -->
    <section class="content-section">
      <div id="tutorial-box">
        <h2 id="step-title">📌 Step 1. 기본형(Cube) 배치하기</h2>
        <p id="step-desc">
          모든 3D 모델링의 시작은 기본 도형입니다. 와콤 펜으로 가볍게 선을 긋는 감각으로 캔버스 속 큐브의 형태를 관찰하세요.
        </p>
      </div>

      <!-- 단계 변경 버튼 -->
      <div class="button-group">
        <button id="prev-btn" class="nav-btn" disabled>이전 단계</button>
        <button id="next-btn" class="nav-btn">다음 단계로 가기 ➔</button>
      </div>
    </section>
  </main>

  <!-- Three.js 및 컨트롤 스크립트 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="main.js"></script>
</body>
</html>
